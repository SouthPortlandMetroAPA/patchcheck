<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PatchCheck - South Portland Metro APA</title>
<style>
  :root { --red:#ea002a; --blue:#0031a1; --ink:#15171a; --mut:#5b6169; --bg:#fff; --card:#fff; --line:#e6e8eb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f4f7; --mut:#a7aeb6; --bg:#15171a; --card:#1d2024; --line:#2c3137; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100svh; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          max-width:460px; width:100%; padding:28px 24px 24px; text-align:center; }
  .bar { height:4px; width:56px; margin:0 auto 20px;
         background:linear-gradient(90deg,var(--red),var(--blue)); border-radius:2px; }
  h1 { margin:0 0 14px; font-size:1.3rem; letter-spacing:-.01em; }
  p { margin:0 0 16px; color:var(--mut); }
  a.mail { color:var(--red); font-weight:600; text-decoration:none; word-break:break-all; }
  a.mail:hover { text-decoration:underline; }
  .btn { display:block; width:100%; margin:22px 0 0; padding:15px 18px; min-height:48px;
         background:var(--red); color:#fff; font-weight:650; font-size:1rem; font-family:inherit;
         border:0; border-radius:10px; cursor:pointer; }
  .btn:hover:not(:disabled) { filter:brightness(1.07); }
  .btn:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  .btn:disabled { cursor:default; }
  .btn.done { background:transparent; color:var(--mut); border:1px solid var(--line); font-weight:600; }
  .btn.err  { background:transparent; color:var(--red); border:1px solid var(--red); font-weight:600; }
  .sig { margin:20px 0 0; font-size:.82rem; color:var(--mut); letter-spacing:.04em; }
</style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <h1>PatchCheck is no longer available.</h1>
    <p>Questions? <a class="mail" href="mailto:southportlandmetroapa@gmail.com">southportlandmetroapa@gmail.com</a></p>
    <button class="btn" id="b" type="button">I&rsquo;d use this again</button>
    <p class="sig">&mdash; SPM APA</p>
  </main>
<script>
// Sends through the league's existing Apps Script mailer, so the click IS the
// send and the button can only claim receipt the server actually confirmed.
// The previous build used mailto: and confirmed on a 400ms timer - with no
// default mail client that opened nothing and still said "we got it".
//
// Content-Type MUST be text/plain. application/json triggers a CORS preflight
// that Apps Script cannot answer; GAS parses the raw body regardless.
(function () {
  var KEY = 'spm-notice-patchcheck-v2';
  var b = document.getElementById('b');
  if (!b) return;

  function lock(text, cls) {
    b.textContent = text;
    b.classList.add(cls);
    b.disabled = true;
  }
  // Only a CONFIRMED send is remembered. A failure is never stored, so the
  // player can try again - and if storage is unavailable the button simply
  // stays usable. Fail open: a duplicate reply costs less than a lost one.
  try { if (localStorage.getItem(KEY)) lock('Thanks \u2014 we got it', 'done'); } catch (e) {}

  b.addEventListener('click', function () {
    if (b.disabled) return;
    b.disabled = true;
    b.textContent = 'Sending\u2026';

    fetch('https://script.google.com/macros/s/AKfycbzGTzkBRTrIIP_tD6sbtOOUmNZkXDdtxPoO4c8fdWt5h3tZFueNSISPv8Q3LWStx73Whw/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'notice_interest', app: 'PatchCheck' })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) {
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          lock('Thanks \u2014 we got it', 'done');
        } else {
          throw new Error('not ok');
        }
      })
      .catch(function () {
        // Say so plainly and point at the address above. Never claim receipt.
        b.disabled = false;
        b.classList.add('err');
        b.textContent = 'Didn\u2019t send \u2014 please email us instead';
      });
  });
})();
</script>
</body>
</html>
