<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PatchCheck - South Portland Metro APA</title>
<style>
  :root { --red:#ea002a; --blue:#0031a1; --ink:#15171a; --mut:#5b6169; --bg:#fff; --card:#fff; --line:#e6e8eb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f4f7; --mut:#a7aeb6; --bg:#15171a; --card:#1d2024; --line:#2c3137; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100svh; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          max-width:460px; width:100%; padding:28px 24px 24px; text-align:center; }
  .bar { height:4px; width:56px; margin:0 auto 20px;
         background:linear-gradient(90deg,var(--red),var(--blue)); border-radius:2px; }
  h1 { margin:0 0 14px; font-size:1.3rem; letter-spacing:-.01em; }
  p { margin:0 0 16px; color:var(--mut); }
  a.mail { color:var(--blue); font-weight:600; text-decoration:none; word-break:break-all; }
  a.mail:hover { text-decoration:underline; }
  .btn { display:block; margin:22px 0 0; padding:15px 18px; min-height:48px;
         background:var(--red); color:#fff; font-weight:650; font-size:1rem;
         border-radius:10px; text-decoration:none; }
  .btn:hover { filter:brightness(1.07); }
  .btn:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  .btn.done { background:transparent; color:var(--mut); border:1px solid var(--line);
              font-weight:600; pointer-events:none; cursor:default; }
  .sig { margin:20px 0 0; font-size:.82rem; color:var(--mut); letter-spacing:.04em; }
</style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <h1>PatchCheck is no longer available.</h1>
    <p>Questions? <a class="mail" href="mailto:southportlandmetroapa@gmail.com">southportlandmetroapa@gmail.com</a></p>
    <a class="btn" id="b" href="mailto:southportlandmetroapa@gmail.com?subject=PatchCheck%20-%20I'd%20use%20this%20again&body=I%20used%20PatchCheck%20and%20I'd%20use%20it%20again%20if%20there's%20ever%20a%20new%20version.%0A%0A(Anything%20you%20want%20to%20add%20is%20welcome%20-%20what%20you%20used%20it%20for%2C%20what%20you'd%20want%20in%20it.)%0A">I&rsquo;d use this again</a>
    <p class="sig">&mdash; SPM APA</p>
  </main>
<script>
// Local only: no network, no keys, no third party. FAILS OPEN - if storage is
// unavailable (private window, blocked site data) the button stays usable,
// because a duplicate reply is cheaper than a lost one. The key is per-app so
// one notice page never disables another. The plain address above stays live
// either way, since clicking is not the same as sending.
(function () {
  var KEY = 'spm-notice-patchcheck-v1';
  var b = document.getElementById('b');
  if (!b) return;
  function done() {
    b.textContent = 'Thanks — we got it';
    b.classList.add('done');
    b.removeAttribute('href');
  }
  try { if (localStorage.getItem(KEY)) done(); } catch (e) {}
  b.addEventListener('click', function () {
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    setTimeout(done, 400);
  });
})();
</script>
</body>
</html>
